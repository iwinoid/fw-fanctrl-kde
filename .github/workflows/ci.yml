name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qml-lint:
    name: QML lint
    runs-on: ubuntu-latest
    container: docker.io/archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install QML toolchain
        # libplasma -> org.kde.plasma.{plasmoid,core,components}
        # plasma5support -> org.kde.plasma.plasma5support
        # kirigami -> org.kde.kirigami
        # Only org.kde.plasma.workspace.osd (OsdWindow, in the huge
        # plasma-workspace package) is not installed; its cascading warnings
        # are filtered below.
        run: pacman -Syu --noconfirm git qt6-declarative kirigami libplasma plasma5support

      - name: qmllint
        # Tolerate only the OsdWindow / missing-workspace-osd-module cascade
        # and generic module-load noise. Any real code problem must fail.
        run: |
          set -euo pipefail
          /usr/lib/qt6/bin/qmllint \
            contents/ui/main.qml contents/ui/FwBackend.qml contents/ui/configCurves.qml \
            > /tmp/lint.log 2>&1 || true
          grep -E "^(Warning|Error)" /tmp/lint.log \
            | grep -viE "(org\.kde\.plasma\.workspace\.osd|OsdWindow|osdValue|osdContent|showingProgress|osdPopup)" \
            | grep -viE "(failed to import|warnings occurred while importing|is not resolved|was not found|is not installed|not found in any|no qualifying module|unknown attached property scope|unknown grouped property scope|import failure|cannot resolve alias)" \
            > /tmp/real.log || true
          if [ -s /tmp/real.log ]; then
            echo "qmllint found real problems:"
            cat /tmp/real.log
            exit 1
          fi
          echo "qmllint: only environment-related warnings, OK"

  python-and-pack:
    name: Python tests & packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile backend
        run: python3 -m py_compile scripts/fw_helper.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build release package
        run: make pack

      - name: Verify package contents
        # Note: avoid `tar | grep -q` under `set -o pipefail` — grep -q closes
        # the pipe early, tar dies with SIGPIPE, and pipefail turns that into a
        # failure even on a successful match. Read the listing into a file first.
        run: |
          set -euo pipefail
          pkg="$(ls ../com.github.iwinoid.fw-fanctrl-kde-*.tar.xz)"
          echo "package: $pkg ($(du -h "$pkg" | cut -f1))"
          tar -tf "$pkg" > /tmp/pkglist
          grep -q "fw-fanctrl-kde/metadata.json"      /tmp/pkglist || { echo "metadata.json missing"; exit 1; }
          grep -q "fw-fanctrl-kde/contents/ui/main.qml" /tmp/pkglist || { echo "main.qml missing"; exit 1; }
          grep -q "fw-fanctrl-kde/scripts/fw_helper.py" /tmp/pkglist || { echo "fw_helper.py missing"; exit 1; }
          if grep -qE "(^|/)tests?/|\.qmllint\.ini|\.github/|pkglist" /tmp/pkglist; then
            echo "dev-only files leaked into the release package"
            grep -E "(^|/)tests?/|\.qmllint\.ini|\.github/|pkglist" /tmp/pkglist
            exit 1
          fi
          echo "package contents OK"